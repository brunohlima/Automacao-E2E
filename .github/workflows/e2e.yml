name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validacao:
    name: Validação do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar a suíte de testes
        run: npx playwright test --list

  smoke:
    name: Smoke test (Nível 1)
    runs-on: ubuntu-latest
    needs: validacao
    # O ambiente de QA é privado: o job só roda quando as credenciais
    # estiverem configuradas em Settings > Secrets and variables > Actions.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar smoke test
        run: npm run test:nivel1

      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
